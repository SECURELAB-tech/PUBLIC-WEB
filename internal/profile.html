<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CorpNet — Mi Perfil</title>
  <link rel="stylesheet" href="/internal/style.css">
</head>
<body>
<div class="app">
 
  <aside class="sidebar">
    <div class="sidebar-logo">Corp<span>Net</span></div>
    <div class="sidebar-section">Menú</div>
    <a class="nav-link" href="/internal/dashboard.html">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      Inicio
    </a>
    <a class="nav-link active" href="/internal/profile.html">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      Mi Perfil
    </a>
    <div class="sidebar-bottom">
      <div class="user-chip">
        <div class="avatar" id="avatar">--</div>
        <div class="user-info">
          <div class="user-name" id="fullName">Cargando...</div>
          <div class="user-role" id="roleBadge">—</div>
        </div>
      </div>
      <a class="nav-link" style="margin-top:4px;" onclick="logout()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Cerrar sesión
      </a>
    </div>
  </aside>
 
  <main class="main">
    <div class="page-header">
      <div class="page-title">Mi Perfil</div>
      <div class="page-sub">Edita tus datos de contacto corporativos</div>
    </div>
 
    <div id="alert" class="alert"></div>
 
    <div class="card">
      <div class="card-title">Información personal</div>
 
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div class="field">
          <label>Nombre completo</label>
          <input type="text" id="full_name">
        </div>
        <div class="field">
          <label>Email corporativo</label>
          <input type="email" id="email">
        </div>
        <div class="field">
          <label>Teléfono</label>
          <input type="text" id="phone" placeholder="6XX XXX XXX">
        </div>
        <div class="field">
          <label>Departamento</label>
          <input type="text" id="department" disabled style="opacity:.5;cursor:not-allowed;">
        </div>
      </div>
 
      <div style="margin-top:8px;">
        <button class="btn btn-primary" onclick="saveProfile()">Guardar cambios</button>
      </div>
    </div>
 
    <div class="card">
      <div class="card-title">Información de cuenta</div>
      <table>
        <tr><td style="color:var(--muted);width:160px;">Usuario</td><td id="infoUser">—</td></tr>
        <tr><td style="color:var(--muted);">Rol</td><td id="infoRole">—</td></tr>
      </table>
    </div>
  </main>
</div>
 
<script>
async function init() {
  const sRes = await fetch('/internal/api/session.php');
  if (!sRes.ok) { window.location.href = '/internal/login.html'; return; }
  const session = await sRes.json();
  if (!session.authenticated) { window.location.href = '/internal/login.html'; return; }
 
  const initials = session.full_name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('avatar').textContent   = initials;
  document.getElementById('fullName').textContent = session.full_name;
  document.getElementById('roleBadge').textContent = session.role;
  document.getElementById('infoUser').textContent  = session.username;
  document.getElementById('infoRole').textContent  = session.role;
 
  const pRes  = await fetch('/internal/api/profile.php');
  const pData = await pRes.json();
  document.getElementById('full_name').value  = pData.full_name;
  document.getElementById('email').value      = pData.email;
  document.getElementById('phone').value      = pData.phone;
  document.getElementById('department').value = pData.department;
}
 
async function saveProfile() {
  const alert = document.getElementById('alert');
  alert.className = 'alert';
 
  // ⚠️ Nota para el presentador:
  // Este formulario envía full_name, email, phone al backend.
  // La VULN 2 consiste en añadir manualmente role=administrator
  // usando curl o Burp Suite, ya que el backend no filtra ese campo.
 
  const body = new URLSearchParams({
    full_name: document.getElementById('full_name').value,
    email:     document.getElementById('email').value,
    phone:     document.getElementById('phone').value
  });
 
  const res  = await fetch('/internal/api/profile.php', { method: 'POST', body });
  const data = await res.json();
 
  if (data.success) {
    alert.textContent = '✓ Perfil actualizado correctamente.';
    alert.className   = 'alert alert-success show';
  } else {
    alert.textContent = data.error || 'Error al guardar.';
    alert.className   = 'alert alert-error show';
  }
}
 
async function logout() {
  await fetch('/internal/api/logout.php');
  window.location.href = '/internal/login.html';
}
 
init();
</script>
</body>
</html>
